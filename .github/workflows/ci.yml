name: Synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked
      - run: make check
      - run: make demo
      # Intentionally do not upload artifacts; only synthetic checks run in CI.
