[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "intent-execution-state"
version = "0.1.0"
description = "Reproducible intent–execution–state research infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pyarrow>=17,<24", "PyYAML>=6,<7"]

[project.optional-dependencies]
research = ["duckdb>=1.1,<2", "lightgbm>=4.5,<5", "scikit-learn>=1.5,<2"]
neural = ["torch>=2.5,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
ies = "ies.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
